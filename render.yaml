services:
  # ----------------------------------------------------
  # WorkPulse Backend API Service (Express + Prisma)
  # ----------------------------------------------------
  - type: web
    name: workpulse-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATA_ENCRYPTION_KEY
        value: e4d9b28a9c3f1567d10e82b4a59f6381c70e28f391b4a7d65c28e930f14b68e2
      - key: ALLOWED_ORIGINS
        value: "*"
